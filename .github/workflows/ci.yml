name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: |
          pip install poetry==1.8.5
      - name: Install dependencies
        run: |
          poetry install
      - name: Run linting
        run: |
          poetry run black --check src/ tests/ scripts/
          poetry run isort --check src/ tests/ scripts/
          poetry run flake8 src/ tests/ scripts/ --max-line-length 88 --extend-ignore E203,W503
      - name: Run Pytest
        run: |
          poetry run pytest tests/ -v
